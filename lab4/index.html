<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">
<head>
    <title> Sign Up Page </title>
    <meta charset="UTF-8">
    <script src="js/script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
            defer></script>
</head>

<body class="bg-subtle">
<div class="container mt-5">
    <div class="card mx-auto shadow-sm">
        <div class="card-body">

            <h2 class="text-center mb-4">Sign Up</h2>

            <form id="signupForm" action="welcome.html">

                <!-- First / Last Name -->
                <div class="mb-3">
                    <label for="fName" class="form-label">First Name</label>
                    <input type="text" id="fName" name="fName" class="form-control">
                    <div id="firstNameFeedback" class="text-danger small"></div>
                </div>

                <div class="mb-3">
                    <label for="lName" class="form-label">Last Name</label>
                    <input type="text" id="lName" name="lName" class="form-control">
                    <div id="lastNameFeedback" class="text-danger small"></div>
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderM" value="m">
                        <label class="form-check-label" for="genderM">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderF" value="f">
                        <label class="form-check-label" for="genderF">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderO" value="o">
                        <label class="form-check-label" for="genderO">Other</label>
                    </div>
                    <div id="genderFeedback" class="text-danger small"></div>
                </div>

                <!-- Zip -->
                <div class="mb-3">
                    <label for="zip" class="form-label">Zip Code</label>
                    <input type="text" id="zip" name="zip" class="form-control">
                    <div id="zipFeedback" class="text-danger small"></div>
                </div>

                <!-- Zip Lookup Results -->
                <div class="mb-3 p-3">
                    <div class="small form-text">City: <span id="city"></span></div>
                    <div class="small form-text">Latitude:<span id="latitude"></span></div>
                    <div class="small form-text">Longitude:<span id="longitude"></span></div>
                </div>

                <!-- State / County -->
                <div class="mb-3">
                    <label for="state" class="form-label">State</label>
                    <select id="state" name="state" class="form-select">
                        <option selected>Select One</option>
                    </select>
                    <div id="stateFeedback" class="text-danger"></div>
                </div>

                <div class="mb-3">
                    <label for="county" class="form-label">County</label>
                    <select id="county" name="county" class="form-select"></select>
                    <div id="countyFeedback" class="text-danger"></div>
                </div>

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Desired Username</label>
                    <input type="text" id="username" class="form-control">
                    <div class="form-text"><span id="usernameFeedback"></span></div>
                </div>

                <div class="mb-3 form-text" id="suggestedPwd"></div>
                <!-- Password -->
                <div class="mb-3">
                    <label for="password1" class="form-label">Password</label>
                    <input type="password" id="password1" class="form-control">
                    <div id="password1Feedback" class="text-danger small"></div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="password2" class="form-label">Type Password Again</label>
                    <input type="password" id="password2" class="form-control">
                    <div class="form-text text-danger" id = "password2Feedback">
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-100">
                    Sign Up
                </button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
